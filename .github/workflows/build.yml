name: createMojmapPaperclipJar

on:
  push:
    branches: [ "ver/26.2.x" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build Paperclip
        run: ./gradlew createPaperclipJar --stacktrace
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 26.2-latest
          name: Folia 26.2 Latest
          files: folia-server/build/libs/folia-paperclip-*.jar
          make_latest: true
          overwrite: true
