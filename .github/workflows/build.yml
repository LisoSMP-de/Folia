name: Build All Versions

on:
  push:
    branches: [ \ ver/26.3.x\ ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: \ver/26.3.x\
            tag_name: \26.3-latest\
            release_name: \Folia 26.3 Latest\
          - branch: \ver/26.2.x\
            tag_name: \26.2-latest\
            release_name: \Folia 26.2 Latest\
          - branch: \ver/1.21.11\
            tag_name: \1.21.11-latest\
            release_name: \Folia 1.21.11 Latest\
    permissions:
      contents: write
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Configure Git User Details
        run: |
          git config --global user.email \actions@github.com\
          git config --global user.name \Github Actions\
      - name: Build All Versions
        run: ./gradlew buildAll --stacktrace
      - name: Release 26.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \26.3-latest\
          name: \Folia 26.3 Latest\
          files: release-jars/folia-paperclip-26.3.jar
          make_latest: true
          overwrite: true
      - name: Release 26.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \26.2-latest\
          name: \Folia 26.2 Latest\
          files: release-jars/folia-paperclip-26.2.jar
          make_latest: true
          overwrite: true
      - name: Release 1.21.11
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \1.21.11-latest\
          name: \Folia 1.21.11 Latest\
          files: release-jars/folia-paperclip-1.21.11.jar
          make_latest: true
          overwrite: true
