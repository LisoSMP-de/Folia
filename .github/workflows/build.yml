name: Build All Versions

on:
  push:
    branches: [ "ver/26.3.x" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: "ver/26.3.x"
            tag_name: "26.3-latest"
            release_name: "Folia 26.3 Latest"
          - branch: "ver/26.2.x"
            tag_name: "26.2-latest"
            release_name: "Folia 26.2 Latest"
          - branch: "ver/1.21.11"
            tag_name: "1.21.11-latest"
            release_name: "Folia 1.21.11 Latest"
    permissions:
      contents: write
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build Paperclip
        run: ./gradlew createPaperclipJar --stacktrace
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag_name }}
          name: ${{ matrix.release_name }}
          files: folia-server/build/libs/folia-paperclip-*.jar
          make_latest: true
          overwrite: true
