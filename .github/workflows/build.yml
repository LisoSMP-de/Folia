name: Build All Versions and Release

on:
  push:
    branches:
      - ver/26.3.x
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  cancel-in-progress: false
  group: build-release

jobs:
  build-26-3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          ref: ver/26.3.x
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git User Details
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"

      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build Paperclip
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p release-jars
          cp folia-server/build/libs/folia-paperclip-*.jar release-jars/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jar-26.3
          path: release-jars/folia-paperclip-*.jar

  build-26-2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          ref: ver/26.2.x
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git User Details
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"

      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build Paperclip
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p release-jars
          cp folia-server/build/libs/folia-paperclip-*.jar release-jars/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jar-26.2
          path: release-jars/folia-paperclip-*.jar

  build-1-21-11:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          ref: ver/1.21.11
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git User Details
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"

      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build Mojmap Paperclip
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p release-jars
          cp folia-server/build/libs/folia-paperclip-*.jar release-jars/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jar-1.21.11
          path: release-jars/folia-paperclip-*.jar

  release:
    needs: [build-26-3, build-26-2, build-1-21-11]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-jars
          merge-multiple: true

      - name: Delete All Old Releases and Tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          : done

      - name: Release All Jars
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 26.3-latest
          name: "Folia 26.3 Latest"
          files: release-jars/*
          make_latest: true
          overwrite: true
